<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Everlands">
<meta name="theme-color" content="#1a0c12">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-180.png">
<title>The Everlands: Of Sugar and Flame</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <button id="goal"><b id="chap"></b><span id="goalText"></span></button>
  <div id="hearts" class="hide"></div>
  <div id="meter" class="hide"><span id="meterLabel"></span><div><i id="meterFill"></i></div></div>
  <button id="hintBtn" aria-label="Show the way"><i data-ic="hint"></i></button>
  <button id="menuBtn" aria-label="Journal"><i data-ic="book"></i></button>
  <canvas id="mini" width="220" height="220" aria-label="Map"></canvas>
</div>
<div id="bark"></div>
<div id="tip" class="hide"></div>

<div id="controls" class="hide">
  <div id="stick"><i></i></div>
  <div id="btns">
    <div id="actChip" class="hide"></div>
    <button id="bAct" class="rb hide" aria-label="Action"><i data-ic="talk"></i><small>Talk</small></button>
    <button id="bWhistle" class="rb sm hide" aria-label="Whistle"><i data-ic="whistle"></i><small>Whistle</small></button>
    <button id="bMed" class="rb sm hide" aria-label="Meditate"><i data-ic="rest"></i><small>Rest</small></button>
    <button id="bFlame" class="rb hide" aria-label="Flame"><i data-ic="flame"></i><small>Flame</small></button>
    <button id="bLand" class="rb hide" aria-label="Land"><i data-ic="land"></i><small>Land</small></button>
    <button id="bBoost" class="rb hide" aria-label="Faster"><i data-ic="fast"></i><small>Faster</small></button>
    <button id="bJump" class="rb" aria-label="Jump"><i data-ic="jump"></i><small>Jump</small></button>
  </div>
</div>

<div id="dialog" class="hide"><div id="dName"></div><div id="dText"></div><div id="dChoices"></div><div id="dNext">▾</div></div>
<div id="qte" class="hide"><button id="qteBtn"></button></div>
<div id="img" class="hide"><img alt=""><p>Tap to continue</p></div>
<div id="cut" class="hide"><div class="cbg" id="cutA"></div><div class="cbg" id="cutB"></div><img id="cutL" class="cutP" alt=""><img id="cutR" class="cutP" alt=""><img id="cutT" alt=""><img id="cutC" alt=""><div id="cutBox" class="hide"><b id="cutName"></b><p id="cutText"></p><i>▾</i></div><button id="cutSkip">Skip ▸▸</button></div>
<div id="fade"><div id="fadeText"></div></div>
<div id="card" class="hide"><small id="cardNum"></small><h1 id="cardTitle"></h1><p id="cardQuote"></p><small id="buildTag" style="position:absolute;right:14px;bottom:10px;font-size:10px;opacity:.45;letter-spacing:.08em">build 63</small></div>

<div id="journal" class="hide">
  <div id="jBox">
    <nav><button data-tab="quest" class="on">Journal</button><button data-tab="map">Map</button><button data-tab="keeps">Keepsakes</button><button data-tab="chapters">Chapters</button><button data-tab="settings">Settings</button><button id="jClose">✕</button></nav>
    <section id="jBody"></section>
  </div>
</div>

<div id="title">
  <small style="position:absolute;right:16px;top:calc(10px + env(safe-area-inset-top, 0px));font-size:10px;letter-spacing:.08em;opacity:.55;color:#fff4e4;text-align:right">build 63<br><span id="diag"></span></small>
  <div id="titleInner">
    <small>THE EVERLANDS</small>
    <h1>Of Sugar and Flame</h1>
    <p class="by">from the book by Elisa Espinosa Ruiz</p>
    <div id="titleBtns"><button id="tContinue" class="hide">Continue</button><button id="tNew">New Story</button></div>
    <p id="loading">Lighting the hearths…</p>
    <p class="hint">On iPhone: tap Share → “Add to Home Screen” to play full-screen. Best held sideways.</p>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
